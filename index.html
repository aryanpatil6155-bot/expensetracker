<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketPlan - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">

    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon">₹</span>
        <div>
          <h1>PocketPlan</h1>
          <p class="tagline">Track every rupee, plan every month</p>
        </div>
      </div>
      <button type="button" id="themeToggle" class="theme-btn" aria-label="Switch theme">🌙 Dark</button>
    </header>

    <section class="summary-grid">
      <article class="summary-card">
        <h2>Total Spent</h2>
        <p id="totalAmount" class="summary-value">₹0.00</p>
      </article>
      <article class="summary-card">
        <h2>Expenses</h2>
        <p id="expenseCount" class="summary-value">0</p>
      </article>
      <article class="summary-card">
        <h2>Top Category</h2>
        <p id="topCategory" class="summary-value">-</p>
      </article>
    </section>

    <div class="main-grid">

      <section class="panel form-panel">
        <h2 id="formHeading">Add Expense</h2>
        <form id="expenseForm" novalidate>
          <input type="hidden" id="expenseId">

          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="e.g. Lunch at canteen">
          </div>

          <div class="field">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g. 120" step="0.01">
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date">
          </div>

          <p id="formError" class="form-error"></p>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">Add Expense</button>
            <button type="button" id="cancelEditBtn" class="btn btn-ghost hidden">Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <h2>Your Expenses</h2>

        <div class="toolbar">
          <div class="field">
            <label for="filterCategory">Category</label>
            <select id="filterCategory">
              <option value="all">All</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="filterMonth">Month</label>
            <input type="month" id="filterMonth">
          </div>

          <div class="field">
            <label for="sortBy">Sort by</label>
            <select id="sortBy">
              <option value="date-desc">Date: newest first</option>
              <option value="date-asc">Date: oldest first</option>
              <option value="amount-desc">Amount: high to low</option>
              <option value="amount-asc">Amount: low to high</option>
            </select>
          </div>

          <button type="button" id="clearFilters" class="btn btn-ghost">Clear</button>
        </div>

        <div class="table-wrap">
          <table class="expense-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expenseList"></tbody>
          </table>
        </div>

        <p id="emptyState" class="empty-state hidden">No expenses to show yet.</p>
        <p class="filtered-total">Total of shown expenses: <strong id="filteredTotal">₹0.00</strong></p>
      </section>

      <section class="panel category-panel">
        <h2>Spending by Category</h2>
        <ul id="categorySummary" class="category-list"></ul>
      </section>

    </div>
  </main>
</body>
</html>
